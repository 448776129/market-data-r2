name: Fetch News

on:
  schedule:
    # 每 1 小时刷新一次新闻（脚本内含重试，单只失败不中断）
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      region:
        description: "限定区域：all=全部, us/cn/hk/kr/etf/cn_etf=单区域"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - us
          - cn
          - hk
          - kr
          - etf
          - cn_etf

env:
  PYTHON_VERSION: "3.11"

# 防止重复手动触发并行运行
concurrency:
  group: fetch-news
  cancel-in-progress: true

jobs:
  # ============ A股（4595 只，分 8 批） ============
  news-cn:
    name: News · A股 (batch ${{ matrix.batch }})
    if: ${{ github.event_name == 'schedule' || github.event.inputs.region == 'all' || github.event.inputs.region == 'cn' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        batch: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch news -> R2 (cn)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FETCH_CONCURRENCY: "8"
        run: python scripts/fetch_news.py --region cn --batch ${{ matrix.batch }} --batches 8

  # ============ 美股（1022 只，分 3 批） ============
  news-us:
    name: News · 美股Russell1000 (batch ${{ matrix.batch }})
    if: ${{ github.event_name == 'schedule' || github.event.inputs.region == 'all' || github.event.inputs.region == 'us' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        batch: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch news -> R2 (us)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FETCH_CONCURRENCY: "10"
        run: python scripts/fetch_news.py --region us --batch ${{ matrix.batch }} --batches 3

  # ============ 港股 + 韩股（小市场） ============
  news-hk-kr:
    name: News · 港股 + 韩股
    if: ${{ github.event_name == 'schedule' || github.event.inputs.region == 'all' || github.event.inputs.region == 'hk' || github.event.inputs.region == 'kr' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch news -> R2 (hk + kr)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FETCH_CONCURRENCY: "10"
        run: |
          python scripts/fetch_news.py --region hk
          python scripts/fetch_news.py --region kr

  # ============ 美股 ETF（831 只，分 3 批） ============
  news-etf:
    name: News · 美股ETF (batch ${{ matrix.batch }})
    if: ${{ github.event_name == 'schedule' || github.event.inputs.region == 'all' || github.event.inputs.region == 'etf' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        batch: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch news -> R2 (etf)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FETCH_CONCURRENCY: "10"
        run: python scripts/fetch_news.py --region etf --batch ${{ matrix.batch }} --batches 3

  # ============ 中国 ETF（211 只） ============
  news-cn-etf:
    name: News · 中国ETF
    if: ${{ github.event_name == 'schedule' || github.event.inputs.region == 'all' || github.event.inputs.region == 'cn_etf' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch news -> R2 (cn_etf)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FETCH_CONCURRENCY: "10"
        run: python scripts/fetch_news.py --region cn_etf
